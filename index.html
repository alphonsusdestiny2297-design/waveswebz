    <script>
      // Early safety guard against browser extension unhandled rejections (e.g. MetaMask / Web3 wallet injectors)
      (function() {
        function shouldSuppress(msg, src) {
          var str = (msg || '').toLowerCase();
          var s = (src || '').toLowerCase();
          return str.includes('metamask') ||
                 str.includes('ethereum') ||
                 str.includes('wallet') ||
                 s.includes('chrome-extension') ||
                 s.includes('moz-extension');
        }
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (shouldSuppress(msg, '')) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) || '';
          var src = (event && (event.filename || '')) || '';
          if (shouldSuppress(msg, src)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
          }
        }, true);

        // Dynamic Canonical and OG URL & Image Resolution
        try {
          if (typeof window !== 'undefined' && window.location) {
            var currentUrl = window.location.origin + window.location.pathname;
            var currentImageUrl = window.location.origin + '/og-image.jpg';
            var canonicalEl = document.querySelector('link[rel="canonical"]');
            if (canonicalEl) canonicalEl.setAttribute('href', currentUrl);
            var ogUrlEl = document.querySelector('meta[property="og:url"]');
            if (ogUrlEl) ogUrlEl.setAttribute('content', currentUrl);
            var ogImg = document.querySelector('meta[property="og:image"]');
            if (ogImg) ogImg.setAttribute('content', currentImageUrl);
            var ogImgSec = document.querySelector('meta[property="og:image:secure_url"]');
            if (ogImgSec) ogImgSec.setAttribute('content', currentImageUrl);
            var twImg = document.querySelector('meta[name="twitter:image"]');
            if (twImg) twImg.setAttribute('content', currentImageUrl);
            var linkImg = document.querySelector('link[rel="image_src"]');
            if (linkImg) linkImg.setAttribute('href', currentImageUrl);
          }
        } catch(e) {}

        // NOTE: service worker registration is handled by vite-plugin-pwa
        // (see registerSW.js injected at build time) — do not register /sw.js here,
        // doing so caused double registration with a conflicting hand-written worker.
      })();
    </script>
